openapi: 3.0.3
info:
  title: API Pokedex TCG
  version: 1.0.0
  description: API pour gérer les utilisateurs, cartes et decks
servers:
  - url: http://localhost:3002/api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
      required:
        - id
        - username
        - email
    Card:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        hp:
          type: integer
        attack:
          type: integer
        type:
          type: string
        pokedexNumber:
          type: integer
      required:
        - id
        - name
        - hp
        - attack
        - type
        - pokedexNumber
    Deck:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        userId:
          type: integer
        cards:
          type: array
          items:
            $ref: '#/components/schemas/Card'
    Error:
      type: object
      properties:
        error:
          type: string
security:
  - bearerAuth: []
