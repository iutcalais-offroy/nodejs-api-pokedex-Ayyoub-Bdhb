paths:
  /decks:
    post:
      summary: Créer un deck
      tags:
        - Decks
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                cards:
                  type: array
                  items:
                    type: integer
      responses:
        '201':
          description: Deck créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
        '400':
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /decks/mine:
    get:
      summary: Récupérer tous les decks de l'utilisateur
      tags:
        - Decks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste de decks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deck'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /decks/{id}:
    get:
      summary: Récupérer un deck par son identifiant
      tags:
        - Decks
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deck trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
        '404':
          description: Deck introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Mettre à jour un deck
      tags:
        - Decks
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                cards:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Deck mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
        '400':
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Deck introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Supprimer un deck
      tags:
        - Decks
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deck supprimé (No Content)
        '403':
          description: Accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Deck introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'