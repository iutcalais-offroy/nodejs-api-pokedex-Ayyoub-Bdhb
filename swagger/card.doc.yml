paths:
  /cards:
    get:
      summary: Récupérer toutes les cartes
      tags:
        - Cards
      responses:
        '200':
          description: Liste de toutes les cartes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'